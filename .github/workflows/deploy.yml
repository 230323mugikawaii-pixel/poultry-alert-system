name: Deploy API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://callnow:callnow@127.0.0.1:5432/callnow_test
      API_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/call-now-api:${{ github.sha }}
      MIGRATION_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/call-now-db-migrate:${{ github.sha }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: callnow_test
          POSTGRES_USER: callnow
          POSTGRES_PASSWORD: callnow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callnow -d callnow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Only non-secret metadata is read here. Fail before Cloud auth/build/deploy.
      - name: Validate environment-specific deploy configuration
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_VARIABLES_JSON: ${{ toJSON(vars) }}
        run: node scripts/validate-deploy-config.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:check-drift
      - run: pnpm test:postgres
      - run: pnpm verify

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - run: docker build --file apps/api/Dockerfile --target runtime --tag "$API_IMAGE" .
      - run: docker build --file apps/api/Dockerfile --target migration --tag "$MIGRATION_IMAGE" .
      - run: docker push "$API_IMAGE"
      - run: docker push "$MIGRATION_IMAGE"

      - name: Deploy migration job
        run: >-
          gcloud run jobs deploy "${{ vars.MIGRATION_JOB_NAME }}"
          --project "${{ vars.GCP_PROJECT_ID }}"
          --region "${{ vars.GCP_REGION }}"
          --image "$MIGRATION_IMAGE"
          --set-cloudsql-instances "${{ vars.CLOUD_SQL_CONNECTION_NAME }}"
          --update-secrets "DATABASE_URL=${{ vars.MIGRATION_DATABASE_URL_SECRET_NAME }}:${{ vars.MIGRATION_DATABASE_URL_SECRET_VERSION }}"
          --service-account "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}"
          --quiet
      - name: Apply database migrations
        run: >-
          gcloud run jobs execute "${{ vars.MIGRATION_JOB_NAME }}"
          --project "${{ vars.GCP_PROJECT_ID }}"
          --region "${{ vars.GCP_REGION }}"
          --wait
          --quiet

      - name: Deploy HTTPS API
        shell: bash
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SMTP_USER_SECRET_NAME: ${{ vars.SMTP_USER_SECRET_NAME }}
          SMTP_USER_SECRET_VERSION: ${{ vars.SMTP_USER_SECRET_VERSION }}
          SMTP_PASSWORD_SECRET_NAME: ${{ vars.SMTP_PASSWORD_SECRET_NAME }}
          SMTP_PASSWORD_SECRET_VERSION: ${{ vars.SMTP_PASSWORD_SECRET_VERSION }}
        run: |
          api_env_vars="APP_ENV=${{ inputs.environment }},TRUST_PROXY_HOPS=1,PUBLIC_ORIGIN=${{ vars.PUBLIC_ORIGIN }},COOKIE_NAME=${{ vars.COOKIE_NAME }},GOOGLE_OAUTH_CLIENT_ID=${{ vars.GOOGLE_OAUTH_CLIENT_ID }},GOOGLE_OAUTH_REDIRECT_URI=${{ vars.GOOGLE_OAUTH_REDIRECT_URI }},MICROSOFT_LOGIN_OAUTH_CLIENT_ID=${{ vars.MICROSOFT_LOGIN_OAUTH_CLIENT_ID }},MICROSOFT_LOGIN_OAUTH_REDIRECT_URI=${{ vars.MICROSOFT_LOGIN_OAUTH_REDIRECT_URI }},MICROSOFT_LOGIN_OAUTH_TENANT=${{ vars.MICROSOFT_LOGIN_OAUTH_TENANT }},GMAIL_OAUTH_CLIENT_ID=${{ vars.GMAIL_OAUTH_CLIENT_ID }},GMAIL_OAUTH_REDIRECT_URI=${{ vars.GMAIL_OAUTH_REDIRECT_URI }},MICROSOFT_OAUTH_CLIENT_ID=${{ vars.MICROSOFT_OAUTH_CLIENT_ID }},MICROSOFT_OAUTH_REDIRECT_URI=${{ vars.MICROSOFT_OAUTH_REDIRECT_URI }},MICROSOFT_OAUTH_TENANT=${{ vars.MICROSOFT_OAUTH_TENANT }},MAIL_TOKEN_ENCRYPTION_PROVIDER=gcp-kms,MAIL_TOKEN_ENCRYPTION_KEY_VERSION=${{ vars.MAIL_TOKEN_ENCRYPTION_KEY_VERSION }},MAIL_KMS_KEY_NAME=${{ vars.MAIL_KMS_KEY_NAME }}"
          api_secrets="DATABASE_URL=${{ vars.DATABASE_URL_SECRET_NAME }}:${{ vars.DATABASE_URL_SECRET_VERSION }},AUTH_TOKEN_PEPPER=${{ vars.AUTH_TOKEN_PEPPER_SECRET_NAME }}:${{ vars.AUTH_PEPPER_SECRET_VERSION }},GOOGLE_OAUTH_CLIENT_SECRET=${{ vars.GOOGLE_OAUTH_CLIENT_SECRET_NAME }}:${{ vars.GOOGLE_OAUTH_CLIENT_SECRET_VERSION }},MICROSOFT_LOGIN_OAUTH_CLIENT_SECRET=${{ vars.MICROSOFT_LOGIN_OAUTH_CLIENT_SECRET_NAME }}:${{ vars.MICROSOFT_LOGIN_OAUTH_CLIENT_SECRET_VERSION }},GMAIL_OAUTH_CLIENT_SECRET=${{ vars.GMAIL_OAUTH_CLIENT_SECRET_NAME }}:${{ vars.GMAIL_OAUTH_CLIENT_SECRET_VERSION }},MICROSOFT_OAUTH_CLIENT_SECRET=${{ vars.MICROSOFT_OAUTH_CLIENT_SECRET_NAME }}:${{ vars.MICROSOFT_OAUTH_CLIENT_SECRET_VERSION }}"
          # Preflight requires all SMTP values in production. In staging an
          # absent value contributes no entry, never an empty Cloud Run setting.
          # Use shell environment values, not interpolation into executable code.
          for name in SMTP_HOST SMTP_PORT SMTP_SECURE EMAIL_FROM; do
            if [[ -n "${!name}" ]]; then
              api_env_vars+=",${name}=${!name}"
            fi
          done
          for name in SMTP_USER SMTP_PASSWORD; do
            secret_name="${name}_SECRET_NAME"
            secret_version="${name}_SECRET_VERSION"
            if [[ -n "${!secret_name}" && -n "${!secret_version}" ]]; then
              api_secrets+=",${name}=${!secret_name}:${!secret_version}"
            fi
          done
          gcloud run deploy "${{ vars.API_SERVICE_NAME }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "$API_IMAGE" \
            --allow-unauthenticated \
            --service-account "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances "${{ vars.CLOUD_SQL_CONNECTION_NAME }}" \
            --update-env-vars "$api_env_vars" \
            --update-secrets "$api_secrets" \
            --min 0 \
            --max 10 \
            --port 8080 \
            --quiet
