name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "phase1/**"
      - "phase3/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: callnow_test
          POSTGRES_USER: callnow
          POSTGRES_PASSWORD: callnow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callnow -d callnow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://callnow:callnow@127.0.0.1:5432/callnow_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:check-drift
      - run: pnpm test:postgres
      - run: pnpm test:postgres:ledger
        env:
          PR01_TEST_ISOLATION_ACK: disposable-postgres
      - run: pnpm test:postgres:outbox
        env:
          PR01_TEST_ISOLATION_ACK: disposable-postgres
      - run: pnpm verify
      - run: pnpm test:postgres:dispatcher
        env:
          PR01_TEST_ISOLATION_ACK: disposable-postgres
      - run: pnpm test:postgres:jobs
        env:
          PR01_TEST_ISOLATION_ACK: disposable-postgres
      - run: pnpm test:postgres:device
        env:
          PR01_TEST_ISOLATION_ACK: disposable-postgres
      - run: pnpm test:postgres:delivery
        env:
          PR01_TEST_ISOLATION_ACK: disposable-postgres
      - run: pnpm test:postgres:apns-worker
        env:
          PR01_TEST_ISOLATION_ACK: disposable-postgres
      - run: pnpm test:postgres:apns
        env:
          PR01_TEST_ISOLATION_ACK: disposable-postgres
