<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>養鶏場通知システム</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f7f8;
  color:#102033;
  padding-bottom:90px;
}
header{
  background:linear-gradient(135deg,#0f766e,#15803d);
  color:white;
  text-align:center;
  padding:34px 16px;
  border-bottom-left-radius:28px;
  border-bottom-right-radius:28px;
}
header h1{
  margin:0;
  font-size:30px;
}
header p{
  font-weight:bold;
  font-size:16px;
}
.page{
  display:none;
  padding:20px;
}
.page.active{
  display:block;
}
.card{
  background:white;
  border-radius:24px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}
h2{
  margin-top:0;
  color:#174a75;
}
.status{
  background:#ecfdf5;
  border-left:8px solid #22c55e;
  padding:18px;
  border-radius:16px;
  font-size:18px;
  font-weight:bold;
  line-height:1.9;
}
.btn{
  width:100%;
  border:none;
  border-radius:18px;
  padding:20px;
  margin:12px 0;
  color:white;
  font-size:22px;
  font-weight:bold;
}
.green{background:#16a34a;}
.red{background:#dc2626;}
.blue{background:#2563eb;}
input,textarea{
  width:100%;
  box-sizing:border-box;
  padding:16px;
  margin:9px 0;
  border:1px solid #cbd5e1;
  border-radius:14px;
  font-size:17px;
}
#testResult{
  font-size:18px;
  font-weight:bold;
}
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  box-shadow:0 -4px 14px rgba(0,0,0,.15);
  z-index:999;
}
.nav button{
  flex:1;
  border:none;
  background:white;
  color:#475569;
  padding:12px 4px 16px;
  font-size:14px;
  font-weight:bold;
}
.nav button.active{
  color:#0f766e;
  background:#ecfdf5;
}
.nav span{
  display:block;
  font-size:26px;
}
</style>
</head>

<body>

<header>
  <h1>🐔 養鶏場通知システム</h1>
  <p>停電・通電をスマホに通知</p>
</header>

<section id="user" class="page active">
  <div class="card">
    <h2>👤 ユーザー情報</h2>
    <div class="status">
      農場名：サンプル養鶏場<br>
      パスワード：123456<br>
      契約期限：2027/06/10<br>
      状態：利用中
    </div>
  </div>
</section>

<section id="test" class="page">
  <div class="card">
    <h2>🔔 通知テスト</h2>
    <p>通知が届くか確認できます。</p>

    <button class="btn green" onclick="sendTest('restore')">
      ✅ 通電テスト
    </button>

    <button class="btn red" onclick="sendTest('outage')">
      🚨 停電テスト
    </button>

    <p id="testResult"></p>
  </div>
</section>

<section id="contact" class="page">
  <div class="card">
    <h2>📩 お問い合わせ</h2>

    <input placeholder="お名前">
    <input placeholder="農場名">
    <input placeholder="メールアドレス">
    <textarea rows="5" placeholder="お問い合わせ内容"></textarea>

    <button class="btn blue" onclick="alert('お問い合わせを受け付けました。')">
      送信
    </button>
  </div>
</section>

<div class="nav">
  <button class="active" onclick="showPage('user',this)">
    <span>👤</span>情報
  </button>

  <button onclick="showPage('test',this)">
    <span>🔔</span>テスト
  </button>

  <button onclick="showPage('contact',this)">
    <span>📩</span>問合せ
  </button>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwdi8ma6y7SXJ1ahIsmpMI_OuCVfiIgJllJsQQydwEEGYSo-BWW73fOw-QUHav-ax_jDA/exec";

function showPage(id, btn){
  document.querySelectorAll(".page").forEach(function(page){
    page.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".nav button").forEach(function(button){
    button.classList.remove("active");
  });

  btn.classList.add("active");
  window.scrollTo(0,0);
}

function sendTest(type){
  document.getElementById("testResult").innerHTML = "送信中...";

  fetch(GAS_URL + "?type=" + type, {
    method: "GET",
    mode: "no-cors"
  });

  if(type === "restore"){
    document.getElementById("testResult").innerHTML = "✅ 通電通知を送信しました。";
  }else{
    document.getElementById("testResult").innerHTML = "🚨 停電通知を送信しました。";
  }
}
</script>

</body>
</html>
